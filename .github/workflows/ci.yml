name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker build --tag kvs-benchmark:test .
      - run: docker run --rm kvs-benchmark:test doctor --config=configs/smoke.json --target=mock --skip-network=true
